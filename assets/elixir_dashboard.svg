<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4e5f; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b8a8d; stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Background -->
  <path d="M100 25 L175 62.5 L175 137.5 L100 175 L25 137.5 L25 62.5 Z" fill="url(#hexGradient)" filter="url(#shadow)"/>

  <!-- Octopus Reporter Body -->
  <path d="M100,70 C125,70 140,90 140,115 C140,140 120,160 100,160 C80,160 60,140 60,115 C60,90 75,70 100,70 Z" fill="#ff7f50"/>

  <!-- Octopus Eyes -->
  <circle cx="85" cy="100" r="10" fill="white"/>
  <circle cx="83" cy="100" r="5" fill="#2c3e50"/>
  <circle cx="115" cy="100" r="10" fill="white"/>
  <circle cx="113" cy="100" r="5" fill="#2c3e50"/>

  <!-- Reporter's Hat -->
  <path d="M80 75 L120 75 L115 60 L85 60 Z" fill="#34495e" />
  <rect x="75" y="70" width="50" height="5" fill="#34495e" />

  <!-- Tentacles -->
  <g fill="none" stroke="#ff7f50" stroke-width="8" stroke-linecap="round">
    <path d="M70,140 Q60,160 50,150" />
    <path d="M80,150 Q70,170 60,160" />
    <path d="M130,140 Q140,160 150,150" />
    <path d="M120,150 Q130,170 140,160" />
    <path d="M90,155 Q80,180 70,170" />
    <path d="M110,155 Q120,180 130,170" />
  </g>

  <!-- Magnifying Glass (as a reporter's tool) -->
  <g transform="rotate(25 150 120)">
    <circle cx="150" cy="100" r="15" fill="none" stroke="silver" stroke-width="4"/>
    <line x1="150" y1="115" x2="150" y2="135" stroke="silver" stroke-width="4"/>
    <circle cx="150" cy="100" r="10" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>
